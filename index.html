<script>

 * 기존 「링크 입력 취합」과 같은 Firebase 프로젝트를 그대로 씁니다.

 */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyD8uE0nKQKMCOlYY-pYRSz7lgvw3GmWoJs",

  storageBucket: "hwpxexcelonmerge.firebasestorage.app",
  messagingSenderId: "263087970580",
  appId: "1:263087970580:web:929ec1cb0e7673e7974a01",
  measurementId: "G-PDV5E6LSM3"
};
// 관리자(파일 등록자)로 허용할 이메일 도메인. 비워 두면 모든 구글 계정 허용.
const ADMIN_EMAIL_DOMAINS = [];
/* ===================================================== */
const MAX_FILE = 50 * 1024 * 1024, CHUNK = 700000, COLS = ["명", "담당", "직위", "전화", "팩스", "부서", "비고"];
const $ = s => document.querySelector(s), app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
let toastT;
function toast(m) { const t = $('#toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(toastT); toastT = setTimeout(() => t.style.display = 'none', 3200); }
function fmt(ts) { if (!ts) return '방금'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); }
function hid(k) { let a = 0xdeadbeef, b = 0x41c6ce57; for (let i = 0; i < k.length; i++) { const c = k.charCodeAt(i); a = Math.imul(a ^ c, 2654435761); b = Math.imul(b ^ c, 1597334677); } a = Math.imul(a ^ (a >>> 16), 2246822507) ^ Math.imul(b ^ (b >>> 13), 3266489909); b = Math.imul(b ^ (b >>> 16), 2246822507) ^ Math.imul(a ^ (a >>> 13), 3266489909); return 'k' + ((a >>> 0).toString(16) + (b >>> 0).toString(16)).padStart(16, '0') + k.length.toString(36); }
const bytesToB64 = u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const b64ToBytes = b => { const s = atob(b); const u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
function dlBlob(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
const isClosed = s => s.closed === true || (s.deadlineAt && s.deadlineAt.toDate() < new Date());

if (!window.firebase || !FIREBASE_CONFIG.apiKey) {
  app.innerHTML = '<div class="card center"><h2>Firebase 설정이 필요합니다</h2><p>파일 상단의 <b>FIREBASE_CONFIG</b>에 Firebase 웹앱 설정값을 넣은 뒤 다시 열어 주세요.</p></div>';
  throw new Error('no config');
}
firebase.initializeApp(FIREBASE_CONFIG);
const auth = firebase.auth(), db = firebase.firestore();
db.settings({ ignoreUndefinedProperties: true, experimentalAutoDetectLongPolling: true, merge: true });
const TS = firebase.firestore.FieldValue.serverTimestamp;
const sid = new URLSearchParams(location.search).get('s');
let subs = [];
const clearSubs = () => { app.style.maxWidth = ''; subs.forEach(f => { try { f() } catch (e) { } }); subs = []; };

/* ---------- HWPX 변수 처리 ---------- */
let pairs = [{ f: '', t: '' }, { f: '', t: '' }, { f: '', t: '' }];
function replaceInDoc(doc,vmap,unmode,stat){
  var HP="http://www.hancom.co.kr/hwpml/2011/paragraph";
  var ps=doc.getElementsByTagNameNS(HP,"p");
  for(var i=0;i<ps.length;i++){
    var p=ps[i],ts=[];
    var tl=p.getElementsByTagNameNS(HP,"t");
    for(var j=0;j<tl.length;j++){var q=tl[j].parentNode;while(q&&q.localName!=="p")q=q.parentNode;if(q===p)ts.push(tl[j])}
    if(!ts.length)continue;
    var nodes=[],full="";
    ts.forEach(function(t){for(var c=t.firstChild;c;c=c.nextSibling){if(c.nodeType===3){nodes.push({n:c,s:full.length});full+=c.nodeValue}}});
    if(full.indexOf("{{")<0)continue;
    var re=/\{\{([^{}]+)\}\}/g,m,reps=[];
    while((m=re.exec(full))){var k=m[1].trim();var v=vmap[k];var has=v!==undefined&&String(v).trim()!=="";
      if(has){reps.push([m.index,m.index+m[0].length,String(v)]);stat.done++}
      else{stat.un[k]=(stat.un[k]||0)+1;if(unmode==="blank")reps.push([m.index,m.index+m[0].length,""])}}
    // 뒤에서부터 적용
    for(var r=reps.length-1;r>=0;r--){
      var a=reps[r][0],b=reps[r][1],val=reps[r][2],first=true;
      for(var u=0;u<nodes.length;u++){
        var nd=nodes[u],ns=nd.s,ne=ns+nd.n.nodeValue.length;
        if(ne<=a||ns>=b)continue;
        var s=nd.n.nodeValue,la=Math.max(a,ns)-ns,lb=Math.min(b,ne)-ns;
        nd.n.nodeValue=s.slice(0,la)+(first?val:"")+s.slice(lb);
        first=false;
      }
      // 위치 재계산
      var acc=0;nodes.forEach(function(nd){nd.s=acc;acc+=nd.n.nodeValue.length});
    }
  }
}

function replacePairs(doc,list,stat){
  var HP="http://www.hancom.co.kr/hwpml/2011/paragraph";
  var ps=doc.getElementsByTagNameNS(HP,"p");
  for(var i=0;i<ps.length;i++){
    var p=ps[i];
    for(var pi=0;pi<list.length;pi++){
      var f=list[pi].f,tv=list[pi].t;
      var ts=[],tl=p.getElementsByTagNameNS(HP,"t");
      for(var j=0;j<tl.length;j++){var q=tl[j].parentNode;while(q&&q.localName!=="p")q=q.parentNode;if(q===p)ts.push(tl[j])}
      if(!ts.length)break;
      var nodes=[],full="";
      ts.forEach(function(t){for(var c=t.firstChild;c;c=c.nextSibling){if(c.nodeType===3){nodes.push({n:c,s:full.length});full+=c.nodeValue}}});
      var reps=[],at=0,x;
      while((x=full.indexOf(f,at))>=0){reps.push([x,x+f.length]);at=x+f.length}
      if(!reps.length)continue;
      stat.pairs[list[pi].idx]=(stat.pairs[list[pi].idx]||0)+reps.length;
      if(stat.dry)continue;
      for(var r=reps.length-1;r>=0;r--){
        var a=reps[r][0],b=reps[r][1],first=true;
        for(var u=0;u<nodes.length;u++){
          var nd=nodes[u],ns=nd.s,ne=ns+nd.n.nodeValue.length;
          if(ne<=a||ns>=b)continue;
          var sv=nd.n.nodeValue,la=Math.max(a,ns)-ns,lb=Math.min(b,ne)-ns;
          nd.n.nodeValue=sv.slice(0,la)+(first?tv:"")+sv.slice(lb);first=false;
        }
        var acc=0;nodes.forEach(function(nd){nd.s=acc;acc+=nd.n.nodeValue.length});
      }
    }
  }
}
function activePairs(){var o=[];pairs.forEach(function(p,i){if(p.f!=="")o.push({f:p.f,t:p.t,idx:i})});return o}
async function processDocs(z,names,vmap,unmode,st,dry){
  var list=activePairs();st.pairs=st.pairs||{};st.dry=dry;
  for(var i=0;i<names.length;i++){
    var txt=await z.file(names[i]).async("string");
    if(txt.indexOf("{{")<0&&!list.length)continue;
    var doc=new DOMParser().parseFromString(txt,"application/xml");
    if(doc.getElementsByTagName("parsererror").length)throw new Error(names[i]+" 읽기 실패");
    if(txt.indexOf("{{")>=0)replaceInDoc(doc,vmap,unmode,st);
    if(list.length)replacePairs(doc,list,st);
    if(dry)continue;
    var out=new XMLSerializer().serializeToString(doc);
    if(!/^<\?xml/.test(out))out='<?xml version="1.0" encoding="UTF-8" standalone="yes" ?>'+out;
    z.file(names[i],out,{createFolders:false});
  }
}

const XMLNAMES = z => Object.keys(z.files).filter(n => /^Contents\/(section|header|masterpage)[^\/]*\.xml$/i.test(n));
async function scanVars(bytes) {
  const z = await JSZip.loadAsync(bytes), seen = new Map();
  for (const n of XMLNAMES(z).sort()) {
    const x = (await z.file(n).async('string')).replace(/<[^>]+>/g, '');
    (x.match(/\{\{[^{}]+\}\}/g) || []).forEach(t => { const k = t.slice(2, -2).trim(); seen.set(k, (seen.get(k) || 0) + 1); });
  }
  return [...seen.entries()];
}
function flatDefaults(o) {
  const f = {};
  Object.keys(o || {}).forEach(k => { const v = o[k]; if (v && typeof v === 'object') Object.keys(v).forEach(c => { f[k + '.' + c] = String(v[c]); }); else if (typeof v === 'string') f[k] = v; });
  return f;
}
async function buildFile(bytes, vmap, unmode) {
  const z = await JSZip.loadAsync(bytes), st = { done: 0, un: {} };
  await processDocs(z, XMLNAMES(z), vmap, unmode, st, false);
  if (z.file('mimetype')) z.file('mimetype', await z.file('mimetype').async('string'), { compression: 'STORE', createFolders: false });
  return { blob: await z.generateAsync({ type: 'blob', mimeType: 'application/hwp+zip', compression: 'DEFLATE' }), st };
}
async function loadBytes(id) {
  const snap = await db.collection('varsets').doc(id).collection('chunks').orderBy('n').get();
  let s = ''; snap.forEach(d => s += d.data().d); return b64ToBytes(s);
}

/* ---------- 입력자 정보 ---------- */
function getMe() { try { return JSON.parse(localStorage.getItem('vs_me') || 'null'); } catch (e) { return null; } }
function askMe(prev) {
  return new Promise(res => {
    const m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div class="box"><h2>입력자 정보</h2><p class="muted">고친 칸마다 이 정보가 기록됩니다.</p>
      <label>이름</label><input type="text" id="mi_n" style="width:100%" value="${esc(prev && prev.name || '')}">
      <label>소속(부서)</label><input type="text" id="mi_d" style="width:100%" value="${esc(prev && prev.dept || '')}">
      <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="pri" id="mi_ok">확인</button></div></div>`;
    document.body.appendChild(m);
    $('#mi_ok').onclick = () => {
      const name = $('#mi_n').value.trim(), dept = $('#mi_d').value.trim();
      if (!name) return toast('이름을 입력해 주세요.'); if (!dept) return toast('소속을 입력해 주세요.');
      const me = { name, dept }; try { localStorage.setItem('vs_me', JSON.stringify(me)); } catch (e) { } m.remove(); res(me);
    };

async function commitNew(u, title, deadline, items, prog) {

/* 기존 세트: 파일 추가 / 교체 */

  for (let i = 0; i < nf.length; i++) await putChunks(ref, nf[i], bytesToB64(items[i].bytes), (a, n) => prog && prog(nf[i].name, a, n, i + 1, nf.length));

}
async function dashboard(u) {
  clearSubs(); app.innerHTML = adminBar(u) + '<div class="card"><div class="row"><h2 style="flex:1;margin:0">내 변수 세트</h2><button class="pri" id="nw">+ 새로 등록</button></div><div id="lst" style="margin-top:10px">불러오는 중…</div></div>'; bindBar(u);
  $('#nw').onclick = () => newForm(u);
  try {
    const s = await db.collection('varsets').where('ownerUid', '==', u.uid).get();
    const L = s.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (b.createdAt ? b.createdAt.seconds : 0) - (a.createdAt ? a.createdAt.seconds : 0));
    $('#lst').innerHTML = L.length ? L.map(x => `<div class="item" style="grid-template-columns:1fr auto"><div><b>${esc(x.title)}</b><div class="muted">변수 ${(x.keys || []).length}종 · ${(x.files || []).length > 1 ? '파일 ' + x.files.length + '개' : esc(x.fileName || '')}${isClosed(x) ? ' · 마감' : ''}</div></div><button data-id="${x.id}">열기</button></div>`).join('') : '<p class="muted">등록된 변수 세트가 없습니다.</p>';
    $('#lst').querySelectorAll('button[data-id]').forEach(b => b.onclick = () => { history.replaceState(null, '', location.pathname + '?s=' + b.dataset.id); location.reload(); });
  } catch (e) { $('#lst').textContent = '불러오지 못했습니다: ' + e.message; }
}
function newForm(u) {
  clearSubs(); app.style.maxWidth = '1500px';
  app.innerHTML = adminBar(u) + `<div class="card"><h2>새 변수 세트 등록</h2>
    <div class="warn"><b>개인정보·보안 사항이 들어 있는 파일은 올리지 마세요.</b> 올린 파일은 Firebase에 저장됩니다. 공통으로 쓰는 파일 여러 개를 한 세트로 올리면, 같은 이름의 변수는 한 번만 입력해도 모든 파일에 들어갑니다.</div>
    <div id="pw"></div>
    <label>마감 일시 (선택)</label><input type="datetime-local" id="ndl">
    <div class="row" style="margin-top:16px"><button class="pri" id="ns" disabled>등록하고 링크 만들기</button><button id="nc">취소</button></div><div class="muted" id="np"></div></div>`;
  bindBar(u); $('#nc').onclick = () => dashboard(u);
  const w = prepWidget($('#pw'), { multi: true, lead: '<label>제목</label><input type="text" id="nt" style="width:100%" placeholder="예: 재난 행동매뉴얼 모음">', onState: r => { const b = $('#ns'); if (b && !b.dataset.busy) b.disabled = !r; } });
  $('#ns').onclick = async () => {
    const btn = $('#ns'); btn.disabled = true; btn.dataset.busy = '1'; btn.textContent = '등록 중…';
    try {
      const items = await w.convertAll();
      const id = await commitNew(u, $('#nt').value.trim(), $('#ndl').value, items, (n, a, t, i, k) => { $('#np').textContent = '파일 올리는 중 (' + i + '/' + k + ') ' + n + ' ' + a + '/' + t; });
      toast('등록되었습니다.'); history.replaceState(null, '', location.pathname + '?s=' + id); location.reload();
    } catch (e) { toast('등록 실패: ' + e.message); $('#np').textContent = ''; w.msg(''); delete btn.dataset.busy; btn.textContent = '등록하고 링크 만들기'; btn.disabled = !w.ready(); }
  };
}

/* ---------- 시작 ---------- */
auth.onAuthStateChanged(u => {
  if (sid) {
    if (!u) { auth.signInAnonymously().catch(e => msgPage('접속 오류', '익명 로그인을 사용할 수 없습니다. 관리자에게 문의해 주세요.<br>' + esc(e.message))); return; }
    sheetMain(u); return;
  }
  if (!u || u.isAnonymous) { loginPage(); return; }
  if (ADMIN_EMAIL_DOMAINS.length && !ADMIN_EMAIL_DOMAINS.some(d => (u.email || '').endsWith('@' + d))) { msgPage('권한이 없습니다', '허용된 이메일 도메인이 아닙니다.'); return; }
  dashboard(u);
});
